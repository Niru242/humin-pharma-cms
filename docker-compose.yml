version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharma-hrms-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: pharma_admin
      POSTGRES_PASSWORD: pharma_secret_2024
      POSTGRES_DB: pharma_hrms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pharma_admin -d pharma_hrms']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharma-hrms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass pharma_redis_2024
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'pharma_redis_2024', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pharma-hrms-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: pharma_minio
      MINIO_ROOT_PASSWORD: pharma_minio_secret_2024
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  miniodata:
